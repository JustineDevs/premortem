apiVersion: v1
kind: Service
metadata:
  name: premortem-api
  namespace: {{ .Values.global.namespace | quote }}
  labels:
{{ include "premortem.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: premortem-api
  ports:
    - name: http
      port: 80
      targetPort: http
