{{- if .Values.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret | quote }}
  namespace: {{ .Values.global.namespace | quote }}
  labels:
{{ include "premortem.labels" . | indent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  DIRECT_URL: {{ .Values.secrets.DIRECT_URL | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.SUPABASE_SERVICE_ROLE_KEY | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | quote }}
  GITLAB_CLIENT_ID: {{ .Values.secrets.GITLAB_CLIENT_ID | quote }}
  GITLAB_CLIENT_SECRET: {{ .Values.secrets.GITLAB_CLIENT_SECRET | quote }}
  PHOENIX_API_KEY: {{ .Values.secrets.PHOENIX_API_KEY | quote }}
  PHOENIX_COLLECTOR_ENDPOINT: {{ .Values.secrets.PHOENIX_COLLECTOR_ENDPOINT | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.LANGFUSE_PUBLIC_KEY | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.LANGFUSE_SECRET_KEY | quote }}
  SENTRY_DSN: {{ .Values.secrets.SENTRY_DSN | quote }}
  POSTHOG_API_KEY: {{ .Values.secrets.POSTHOG_API_KEY | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.STRIPE_SECRET_KEY | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.STRIPE_WEBHOOK_SECRET | quote }}
{{- end }}
