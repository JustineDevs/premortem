apiVersion: apps/v1
kind: Deployment
metadata:
  name: premortem-agent-builder
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "premortem.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.agentBuilder.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: premortem-agent-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: premortem-agent-builder
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: premortem-agent-builder
      containers:
        - name: agent-builder
          image: "{{ .Values.agentBuilder.image.repository }}:{{ .Values.agentBuilder.image.tag }}"
          imagePullPolicy: {{ .Values.agentBuilder.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: premortem-runtime-config
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
          resources:
            requests:
              cpu: {{ .Values.agentBuilder.resources.requests.cpu | quote }}
              memory: {{ .Values.agentBuilder.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.agentBuilder.resources.limits.cpu | quote }}
              memory: {{ .Values.agentBuilder.resources.limits.memory | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
