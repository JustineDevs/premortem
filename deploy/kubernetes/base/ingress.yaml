apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: premortem-api
  namespace: premortem
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.jstn.site
      secretName: premortem-api-tls
  rules:
    - host: api.jstn.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: premortem-api
                port:
                  number: 80
