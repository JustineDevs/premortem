apiVersion: v1
kind: LimitRange
metadata:
  name: premortem-runtime-limits
  namespace: premortem
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 4Gi
