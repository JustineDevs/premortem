name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: https://api.jstn.site
    env:
      ECS_HOST: ${{ secrets.ALIBABA_CLOUD_ECS_HOST }}
      ECS_PORT: ${{ secrets.ALIBABA_CLOUD_ECS_SSH_PORT }}
      ECS_USER: ${{ secrets.ALIBABA_CLOUD_ECS_USER || secrets.ALIBABA_CLOUD_ECS_SSH_USER || 'root' }}
      ECS_PRIVATE_KEY: ${{ secrets.ALIBABA_CLOUD_ECS_PRIVATE_KEY || secrets.ALIBABA_CLOUD_ECS_SSH_PRIVATE_KEY }}
      ECS_PASSWORD: ${{ secrets.ALIBABA_CLOUD_ECS_PASSWORD || secrets.ALIBABA_CLOUD_ECS_SSH_PASSWORD }}
      ECS_APP_DIR: ${{ secrets.ALIBABA_CLOUD_ECS_APP_DIR }}
      ECS_PUBLIC_URL: ${{ secrets.ALIBABA_CLOUD_ECS_PUBLIC_URL }}
      ECS_DEPLOY_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate ECS deploy inputs
        run: |
          : "${ECS_HOST:?ALIBABA_CLOUD_ECS_HOST secret is required}"
          : "${ECS_USER:=root}"
          ECS_PORT="${ECS_PORT:-22}"
          ECS_APP_DIR="${ECS_APP_DIR:-/root/workspace/premortem}"
          ECS_PUBLIC_URL="${ECS_PUBLIC_URL:-https://api.jstn.site}"
          ECS_SSH_REACHABLE=false
          if timeout 5 bash -lc ">/dev/tcp/${ECS_HOST}/${ECS_PORT}" >/dev/null 2>&1; then
            ECS_SSH_REACHABLE=true
          fi
          if [ -z "${ECS_PRIVATE_KEY:-}" ] && [ -z "${ECS_PASSWORD:-}" ]; then
            ECS_CAN_DEPLOY=false
            ECS_AUTH_MODE=verify-only
          elif [ "${ECS_SSH_REACHABLE}" != "true" ]; then
            ECS_CAN_DEPLOY=false
            ECS_AUTH_MODE=verify-only
          else
            ECS_CAN_DEPLOY=true
            ECS_AUTH_MODE=$([ -n "${ECS_PRIVATE_KEY:-}" ] && printf key || printf password)
          fi
          {
            echo "ECS_HOST=$ECS_HOST"
            echo "ECS_PORT=$ECS_PORT"
            echo "ECS_USER=$ECS_USER"
            echo "ECS_SSH_REACHABLE=$ECS_SSH_REACHABLE"
            echo "ECS_CAN_DEPLOY=$ECS_CAN_DEPLOY"
            echo "ECS_AUTH_MODE=$ECS_AUTH_MODE"
            echo "ECS_APP_DIR=$ECS_APP_DIR"
            echo "ECS_PUBLIC_URL=$ECS_PUBLIC_URL"
            echo "ECS_DEPLOY_REF=$ECS_DEPLOY_REF"
          } >>"$GITHUB_ENV"

      - name: Deploy API on Alibaba Cloud ECS
        run: |
          if [ "${ECS_CAN_DEPLOY:-false}" = "true" ]; then
            bash scripts/deploy/alibaba-cloud-ecs-runtime.sh
          else
            echo "Skipping SSH deploy path because ECS is not reachable from GitHub Actions or auth is unavailable; verifying the current production-api deployment only."
          fi

      - name: Verify public API endpoint
        run: |
          curl --fail --show-error --silent --max-time 20 "${ECS_PUBLIC_URL}/health" | tee /tmp/premortem-api-public-health.json

  deploy-web:
    needs: deploy-api
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: https://premortem.jstn.site
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_APP_URL: https://premortem.jstn.site
      PREMORTEM_API_BASE_URL: https://api.jstn.site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate Vercel deploy inputs
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            VERCEL_CAN_DEPLOY=false
            VERCEL_DEPLOY_MODE=verify-only
          else
            VERCEL_CAN_DEPLOY=true
            VERCEL_DEPLOY_MODE=deploy
          fi
          echo "VERCEL_CAN_DEPLOY=$VERCEL_CAN_DEPLOY" >>"$GITHUB_ENV"
          echo "VERCEL_DEPLOY_MODE=$VERCEL_DEPLOY_MODE" >>"$GITHUB_ENV"
          echo "VERCEL_CAN_DEPLOY=$VERCEL_CAN_DEPLOY"
          echo "VERCEL_DEPLOY_MODE=$VERCEL_DEPLOY_MODE"

      - name: Deploy Web to Vercel
        run: |
          if [ "${VERCEL_CAN_DEPLOY:-false}" = "true" ]; then
            pnpm dlx vercel@latest deploy \
              --prod \
              --yes \
              --token "$VERCEL_TOKEN"
          else
            echo "Skipping Vercel deploy because production deploy credentials are unavailable; verifying the live web entrypoint instead."
          fi

      - name: Smoke the production web entrypoint
        run: |
          http_code="$(curl -sS -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' -D /tmp/premortem-web-headers.txt -o /tmp/premortem-web-home.html -w '%{http_code}' https://premortem.jstn.site || true)"
          if [ "$http_code" = "200" ]; then
            grep -q "Premortem" /tmp/premortem-web-home.html
          elif [ "$http_code" = "429" ] && grep -q "Vercel Security Checkpoint" /tmp/premortem-web-home.html; then
            echo "Bot protection checkpoint is active on the production web entrypoint."
          else
            echo "Unexpected web smoke response: HTTP $http_code" >&2
            cat /tmp/premortem-web-home.html >&2 || true
            exit 1
          fi
