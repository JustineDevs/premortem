services:
  postgres:
    image: postgres:16
    container_name: premortem-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: premortem
    ports:
      - "${PREMORTEM_DOCKER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-citext.sql:ro
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: premortem-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password12345}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${PREMORTEM_DOCKER_NEO4J_HTTP_PORT:-7474}:7474"
      - "${PREMORTEM_DOCKER_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
